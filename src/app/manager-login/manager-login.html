<div class="frosted-auth-card">
  <div class="glass-section-header">🛡️ Administrative Clearance</div>
  <p class="auth-helper-text">Please input your encrypted administrative staff key coordinates to open the accounting ledger metrics.</p>
  
  <div class="credential-entry-form">
    <div class="input-wrapper-field">
      <label>Admin Username Address</label>
      <input type="text" [(ngModel)]="adminUsername" name="adminUsername" placeholder="Enter admin username" required>
    </div>

    <div class="input-wrapper-field">
      <label>Secret Passcode</label>
      <input type="password" [(ngModel)]="adminPassword" name="adminPassword" placeholder="Enter passcode" (keyup.enter)="handleManagerLogin()" required>
    </div>

    <div *ngIf="managerLoginError" class="manager-error-toast">❌ {{ managerLoginError }}</div>
    <button type="button" class="submit-auth-btn" (click)="handleManagerLogin()">Unlock Ledgers</button>
  </div>
</div>
